name: Prueba Gaceta

on:
  workflow_dispatch:

jobs:

  prueba:

    runs-on: ubuntu-latest

    steps:

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar requests
      run: |
        python -m pip install requests

    - name: Ejecutar diagnóstico
      run: |
        python prueba.py
