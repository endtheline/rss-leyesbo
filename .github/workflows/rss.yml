name: Crear RSS Gaceta Bolivia

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  rss:

    runs-on: ubuntu-latest

    steps:

    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Diagnóstico DNS
      run: |
        python - <<EOF
        import socket
        dominio = "gacetaoficialdebolivia.gob.bo"
        print("Resolviendo:", dominio)
        print(socket.gethostbyname(dominio))
        EOF

    - name: Crear RSS
      run: |
        python scraper.py

    - name: Guardar feed.xml
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

        git add feed.xml

        git commit -m "Actualizar RSS" || echo "Sin cambios"

        git push
